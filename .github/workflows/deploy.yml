name: Model Deployment

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set Docker image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:${{ github.sha }} \
            -t $IMAGE_NAME:latest \
            .

      - name: Run container for smoke test
        run: |
          docker run -d \
            --name ml-service-test \
            -p 8000:8000 \
            -e MODEL_VERSION=${{ secrets.MODEL_VERSION || 'v1.1.0' }} \
            $IMAGE_NAME:${{ github.sha }}

      - name: Wait for service startup
        run: |
          sleep 10
          docker ps

      - name: Check health endpoint
        run: |
          curl -f http://localhost:8000/health

      - name: Check metrics endpoint
        run: |
          curl -f http://localhost:8000/metrics

      - name: Check predict endpoint
        run: |
          curl -f -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"features": [5.1, 3.5, 1.4, 0.2]}'

      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Push Docker image to GitHub Container Registry
        run: |
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest

      - name: Deploy via API
        run: |
          echo "Deployment API call is skipped in this educational project."
          echo "Prepared image: $IMAGE_NAME:${{ github.sha }}"
          echo "For real deployment, configure CLOUD_TOKEN and cloud provider endpoint."
          echo "Expected secret names: CLOUD_TOKEN, MODEL_VERSION"
